name: gf2_es_patch
description: "Instalador Android del parche español de Girls' Frontline 2: Exilium (cliente CN) mediante Shizuku."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  shizuku_api: 1.2.2
  archive: ^4.5.2
  file_picker: ^13.2.0
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - img/game/
    - patch/
  fonts:
    - family: MiSans
      fonts:
        - asset: fonts/MiSans-Semibold.ttf
          weight: 600
        - asset: fonts/MiSans-Bold.ttf
          weight: 700
